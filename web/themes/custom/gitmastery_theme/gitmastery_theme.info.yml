name: GitMastery Theme
type: theme
base theme: olivero
description: GitMastery documentation theme — Olivero sub-theme with Git orange accent colors.
core_version_requirement: ^11
package: Custom

libraries:
  - gitmastery_theme/global

# Use Olivero's region names exactly so page.html.twig renders them correctly.
regions:
  header: Header
  primary_menu: Primary menu
  secondary_menu: Secondary menu
  hero: Hero (full width)
  highlighted: Highlighted
  breadcrumb: Breadcrumb
  social: Social Bar
  content_above: Content Above
  content: Content
  sidebar: Sidebar
  content_below: Content Below
  footer_top: Footer Top
  footer_bottom: Footer Bottom
