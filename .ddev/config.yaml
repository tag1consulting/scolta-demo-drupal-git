name: gitmastery
type: drupal
docroot: web
php_version: "8.4"
webserver_type: nginx-fpm
router_http_port: "80"
router_https_port: "443"
mariadb_version: "10.11"
database:
  type: mariadb
  version: "10.11"

hooks:
  post-start:
    - exec: composer install --no-interaction
    - exec: |
        if [ -f /var/www/html/db/dump.sql.gz ]; then
          echo "Importing database..."
          zcat /var/www/html/db/dump.sql.gz | mysql -u root -proot db
          drush config:import --partial --source=../config/sync -y
          drush cache:rebuild
          drush php:script /var/www/html/import/setup-about-page.php
          echo "Database imported and caches cleared."
          echo "Regenerating URL aliases for all content and languages..."
          drush pathauto:aliases-generate all
          echo "URL aliases regenerated."
          echo "Building Scolta/Pagefind search index..."
          mkdir -p /var/www/html/web/sites/default/private
          drush scolta:build
          echo "Search index built."
        else
          echo "No database dump found, skipping import."
        fi

additional_fqdns: []
